[project]
name = "artify-api"
version = "0.1.0"
description = "FastAPI service for ArtifyAIv.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "celery>=5.4",
  "redis>=5.0",
  "watchfiles>=0.21",
  "httpx>=0.27",
  "artify-common>=0.1",
  "flower>=2.0", 
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
artify-api = "app.main:run"

[tool.uv.sources]
artify-common = { workspace = true }
